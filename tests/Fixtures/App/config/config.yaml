framework:
  test: true
  secret: "test"
  # Debug kernels say `noindex` on every response; production ones do not,
  # and the robots tests read what the package says on its own.
  disallow_search_engine_index: false

twig:
  strict_variables: true

wexample_symfony_loader:
  front_paths:
    front: '%kernel.project_dir%/../front/'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyForms\Tests\Fixtures\App\Form\:
    resource: '../Form/'

  # symfony-testing registers it with the string '@kernel' instead of a
  # reference, which only YAML turns into the kernel service.
  Wexample\SymfonyHelpers\Service\BundleService:
    arguments: ['@kernel']

doctrine:
  orm:
    mappings:
      FormsFixtures:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/Entity'
        prefix: 'Wexample\SymfonyForms\Tests\Fixtures\App\Entity'
